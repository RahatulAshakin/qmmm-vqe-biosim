[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmmm-vqe-biosim"
version = "0.1.0"
description = "Benchmark-gated QM->active space->qubit Hamiltonian->VQE/ADAPT-VQE workflow (PySCF + Qiskit Nature)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahatul Ashakin" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
